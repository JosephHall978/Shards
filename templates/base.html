<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shards{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar shards-nav" role="navigation">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item shards-brand" href="{{ url_for('index') }}">
          <span class="shards-brand-mark">◆</span>&nbsp;Shards
        </a>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </section>

  <footer class="footer shards-footer">
    <div class="content has-text-centered">
      <p>Shards &mdash; repo hygiene, at a glance.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
